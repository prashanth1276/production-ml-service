name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]

    env:
      LLM_BACKEND: mock
      RATE_LIMIT_ENABLED: "false"
      REDIS_ENABLED: "false"
      MONGO_URI: mongodb://localhost:27017
      REDIS_URL: redis://localhost:6379
      LOG_JSON: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: ruff check app/ eval/ --output-format=github || true

      - name: Run tests
        run: pytest app/tests/ -v

      - name: Verify app imports
        run: python -c "from app.main import app; print('App imports OK')"

  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: production-ml-service:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
        
  compose-smoke-test:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for services to be healthy
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "App is up"
              exit 0
            fi

            echo "Waiting... ($i/30)"
            sleep 5
          done

          echo "Application failed to become healthy"
          docker compose ps
          docker compose logs web
          exit 1

      - name: Seed the database
        run: docker compose run --rm web python scripts/seed_db.py

      - name: Verify endpoints
        run: |
          curl -f http://localhost:8000/health
          curl -f http://localhost:8000/ready
          curl -f "http://localhost:8000/api/recommendations?query=running+shoes&top_k=5"
          curl -f -X POST http://localhost:8000/api/conversation \
            -H "Content-Type: application/json" \
            -d '{"message":"shoes under 500"}'
          curl -f http://localhost:8000/metrics | grep index_size_products

      - name: Verify Prometheus is scraping
        run: |
          sleep 20
          curl -sf http://localhost:9090/api/v1/targets | grep -q '"health":"up"'

      - name: Verify Grafana is up
        run: |
          curl -sf http://localhost:3000/api/health | grep -q '"database": "ok"'

      - name: Show compose logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v